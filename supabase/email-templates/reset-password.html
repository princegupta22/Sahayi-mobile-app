<!-- Supabase Dashboard → Authentication → Email Templates → "Reset Password"
     Subject:  Your Sahayi password reset code
     Paste the HTML below as the message body. {{ .Token }} is the code (6 to 10 digits, set in Auth → Email → OTP length)
     the app asks for. Do NOT use {{ .ConfirmationURL }} (that sends a link). -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:auto;padding:24px;color:#1c2a1f">
  <h2 style="color:#1b5e20;margin:0 0 12px">Reset your Sahayi password</h2>
  <p>Use this verification code in the app to set a new password:</p>
  <p style="font-size:34px;font-weight:700;letter-spacing:8px;background:#f6faf5;border:1px solid #dfe9dc;border-radius:12px;padding:16px;text-align:center;margin:20px 0">{{ .Token }}</p>
  <p style="color:#5b6b5e;font-size:14px">The code is valid for a short time. If you did not ask for this, you can safely ignore this email, your password will not change.</p>
  <p style="color:#5b6b5e;font-size:14px">– Team Sahayi</p>
</div>
